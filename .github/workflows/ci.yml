name: CI
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: quiniela, POSTGRES_PASSWORD: quiniela, POSTGRES_DB: quiniela }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quiniela -d quiniela" --health-interval 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - run: pip install -r requirements.txt
      - run: python -m pytest
        env: { DATABASE_URL: postgresql+psycopg://quiniela:quiniela@localhost:5432/quiniela }
