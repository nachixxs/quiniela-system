<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <title>Prototipos: inicio (temporal)</title>
    <script>
      (function () {
        try {
          var g = localStorage.getItem("proto-tema");
          document.documentElement.classList.toggle("dark", g ? g === "oscuro" : matchMedia("(prefers-color-scheme: dark)").matches);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { montar } from "./harness.tsx";
      import { InicioLibro as Libro } from "./inicio-libro.tsx";
      import { InicioCifra as Cifra } from "./inicio-cifra.tsx";
      import { InicioAfinado as Afinado } from "./inicio-afinado.tsx";
      montar([
        { nombre: "Libro", Pantalla: Libro },
        { nombre: "Cifra", Pantalla: Cifra },
        { nombre: "Afinado", Pantalla: Afinado },
      ]);
    </script>
  </body>
</html>
