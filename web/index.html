<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101a33" />
    <title>Quiniela La Estrella</title>
    <script>
      (function () {
        try {
          var guardado = localStorage.getItem("quiniela-tema");
          var oscuro = guardado ? guardado === "oscuro" : matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", oscuro);
          document.querySelector('meta[name="theme-color"]').setAttribute("content", oscuro ? "#151f3c" : "#101a33");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
